name: Deploy to Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::299482272081:role/akertech-github-deploy
          aws-region: eu-central-1

      - name: Package
        run: zip -q -r function.zip index.mjs site

      - name: Deploy
        run: |
          aws lambda update-function-code --function-name akertech-site --zip-file fileb://function.zip > /dev/null
          aws lambda wait function-updated --function-name akertech-site
          echo "Deployed"
