name: Deploy to Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import sys,json,base64;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);d=json.loads(base64.urlsafe_b64decode(p));print(json.dumps({k:d.get(k) for k in ['iss','aud','sub','repository','ref']},indent=1))" "$TOKEN"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::299482272081:role/akertech-github-deploy
          aws-region: eu-central-1

      - name: Package
        run: |
          shopt -s nullglob
          zip -q function.zip index.mjs *.html *.css *.js *.webp *.png *.jpg *.svg *.ico
          unzip -l function.zip

      - name: Deploy
        run: |
          aws lambda update-function-code --function-name akertech-site --zip-file fileb://function.zip > /dev/null
          aws lambda wait function-updated --function-name akertech-site
          echo "Deployed"
